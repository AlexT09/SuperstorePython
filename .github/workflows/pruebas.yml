name: pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest==9.2.0
      - name: Ejecutar las pruebas
        run: python -m pytest -q tests
